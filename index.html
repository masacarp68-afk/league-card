<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>順位表 画像ジェネレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>順位表 画像ジェネレーター</h1>
    <div class="mode" role="radiogroup" aria-label="種別">
      <label><input type="radio" name="mode" value="league"> リーグ戦</label>
      <label><input type="radio" name="mode" value="jantoryu"> 雀竜位戦</label>
    </div>
    <p class="guide" data-mode="league">スプレッドシートで「順位／組／登録名／トータル／対局数」を<strong>見出し行ごと</strong>範囲選択してコピー → 下の欄に貼り付け</p>
    <p class="guide" data-mode="jantoryu" hidden>スプレッドシートで「登録名／ポイント」を<strong>見出し行ごと</strong>範囲選択してコピー（各回戦の列が混ざっていてOK）→ 下の欄に貼り付け</p>
  </header>
  <main>
    <section class="panel">
      <label for="paste">貼り付け</label>
      <textarea id="paste" rows="6" placeholder="ここに Ctrl+V" spellcheck="false"></textarea>
      <p id="message" class="message"></p>
    </section>
    <section class="panel settings">
      <label>タイトル <input id="title" type="text" placeholder="第24期 雀王戦【A2】リーグ"></label>
      <span class="hint">最後のスペースより前は小さく表示。【 】で囲んだ部分が金色になります</span>
      <label>節 <input id="session" type="text" placeholder="第9節"></label>
      <label>全節数 <input id="totalSessions" type="number" min="0" inputmode="numeric"></label>
      <label>全回戦数 <input id="totalGames" type="number" min="0" inputmode="numeric"></label>
      <div class="zones">
        <span class="zones-title" id="upTitle">昇級（上位から）</span>
        <label><i class="sw sw-gold"></i>金 <input id="promote1" type="number" min="0" inputmode="numeric"> 名</label>
        <label><i class="sw sw-silver"></i>銀 <input id="promote2" type="number" min="0" inputmode="numeric"> 名</label>
        <label><i class="sw sw-bronze"></i>銅 <input id="promote3" type="number" min="0" inputmode="numeric"> 名</label>
        <span class="hint">2・3段階昇級があるリーグは上のグループから順に。1段階だけなら金だけ</span>
      </div>
      <div class="zones">
        <span class="zones-title" id="downTitle">降級（下位から）</span>
        <label><i class="sw sw-red"></i>赤 <input id="demote1" type="number" min="0" inputmode="numeric"> 名</label>
        <label><i class="sw sw-pink"></i>薄赤 <input id="demote2" type="number" min="0" inputmode="numeric"> 名</label>
        <span class="hint">足切りなど2段階あるときは、最下位側を赤に</span>
      </div>
      <label>テーマ <select id="theme"></select></label>
      <label>テーマ色 <input id="color" type="color"></label>
      <label><input id="showGames" type="checkbox"> 対局数を表示</label>
    </section>
    <section class="panel actions">
      <button id="copy" type="button" disabled>画像をコピー</button>
      <button id="download" type="button" disabled>ダウンロード</button>
      <span id="flash" class="flash" role="status"></span>
    </section>
    <section id="preview" class="preview" aria-label="プレビュー"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
